{{ define "main" }}
<div class="home-info">
  {{ range .Site.Params.homeInfoParams }}
    <p>{{ . }}</p>
  {{ end }}
</div>

<section>
  <h2>最新文章</h2>
  <ul class="post-list">
    {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time>{{ .Date.Format "2006-01-02" }}</time>
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}

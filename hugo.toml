baseURL = 'https://CHET-LI.github.io/'
languageCode = 'zh-cn'
title = '切特的技术博客'
theme = 'PaperMod'

[params]
  homeInfoParams = [
    "Title: AI Agent 工程实践",
    "Description: 沉淀 AI Agent 开发、工程化、生产落地的实战笔记"
  ]
  profileMode = false
  showReadingTime = true
  showShareButtons = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showRssButtonInSectionTermList = true
  showToc = true
  tocOpen = false
  comments = false
  assets = { disableHLJS = false }
  socialIcons = [
    { name = "github", url = "https://github.com/CHET-LI" },
    { name = "email", url = "mailto:chet@example.com" }
  ]

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 30
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"